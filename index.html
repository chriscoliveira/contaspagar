<form id="form">
  <input type="text" id="descricao" placeholder="Descrição" required>

  <input type="number" step="0.01" id="valor" placeholder="Valor (ex: 123.45)" required>

  <input type="number" id="parcelas" value="1" min="1">

  <select id="cartao">
    <option>Nubank</option>
    <option>Itaú</option>
    <option>Inter</option>
  </select>

  <input type="date" id="data" required>

  <select id="ciclo">
    <option value="1">Pagar com salário dia 1</option>
    <option value="15">Pagar com salário dia 15</option>
  </select>

  <label>
    <input type="checkbox" id="fixo"> Conta fixa mensal
  </label>

  <button type="submit">Adicionar</button>
</form>
