<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Controle Financeiro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>💸 Controle Financeiro</h1>

<form id="form">
  <input type="text" id="descricao" placeholder="Descrição" required>

  <input type="number" step="0.01" id="valor" placeholder="Valor (ex: 123.45)" required>

  <input type="number" id="parcelas" value="1" min="1">

  <select id="cartao">
    <option>Nubank</option>
    <option>Itaú</option>
    <option>Inter</option>
    <option>Outro</option>
  </select>

  <input type="date" id="data" required>

  <select id="ciclo">
    <option value="1">Salário dia 1</option>
    <option value="15">Salário dia 15</option>
  </select>

  <label>
    <input type="checkbox" id="fixo"> Conta fixa
  </label>

  <button type="submit">Adicionar</button>
</form>

<hr>

<div class="container">
  <div>
    <h2>💰 Ciclo dia 1</h2>
    <ul id="lista1"></ul>
    <h3 id="total1"></h3>
  </div>

  <div>
    <h2>💰 Ciclo dia 15</h2>
    <ul id="lista15"></ul>
    <h3 id="total15"></h3>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
